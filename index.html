<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda Cepatik - Cloud Print & Kiosk Mandiri</title>

  <!-- Font Google agar tulisan rapi dan modern -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Menghubungkan CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <!-- 2. Bagian Navbar (Menu & Tombol) -->
  <nav class="navbar">

    <!-- Logo -->
    <div class="logo">
      <img src="assets/images/logo.svg" alt="Cepatik Logo">
    </div>

    <!-- Menu Navigasi -->
    <ul class="menu">
      <li><a href="#" class="aktif">Beranda</a></li>
      <li><a href="#">Cara<br>Kerja</a></li>
      <li><a href="#">Kalkulator<br>Tarif</a></li>
      <li><a href="#">Lokasi Mitra &amp;<br>Kiosk</a></li>
      <li><a href="#">Keunggulan</a></li>
      <li><a href="#">Bantuan</a></li>
    </ul>

    <!-- Tombol-tombol di Sebelah Kanan -->
    <div class="tombol-grup">

      <!-- Tombol Cek Pesanan -->
      <button type="button" class="btn btn-cek">
        <span class="ikon">🔍</span>
        <span>Cek<br>Pesanan</span>
      </button>

      <!-- Tombol Scan QR Kiosk -->
      <button type="button" class="btn btn-scan">
        <span class="ikon">⛶</span>
        <span>Scan QR<br>Kiosk</span>
      </button>

      <!-- Tombol Mulai Cetak -->
      <button type="button" class="btn btn-cetak">
        <span>Mulai<br>Cetak</span>
        <span class="panah">&rarr;</span>
      </button>

    </div>

  </nav>

</body>

</html>
